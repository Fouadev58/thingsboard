  start-thingsboard:
    runs-on: ubuntu-latest
    needs: build-and-unit-tests

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Start ThingsBoard (Docker)
        run: |
          cd docker
          docker compose up -d
          docker compose ps

      - name: Wait for ThingsBoard to start (up to 15 min)
        run: |
          # ThingsBoard peut être lent au premier démarrage en CI
          for i in {1..180}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080 || true)
            if echo "$code" | grep -qE "200|302|401"; then
              echo "ThingsBoard is responding (HTTP $code)"
              exit 0
            fi
            echo "Waiting for ThingsBoard... ($i/180) HTTP=$code"
            sleep 5
          done
          echo "ThingsBoard did not start in time"
          exit 1

      - name: Debug info (always)
        if: always()
        run: |
          cd docker
          echo "=== docker compose ps ==="
          docker compose ps
          echo "=== docker ps ==="
          docker ps

      - name: Logs (on failure)
        if: failure()
        run: |
          cd docker
          echo "=== docker compose logs (last 300 lines) ==="
          docker compose logs --no-color | tail -n 300

      - name: Stop ThingsBoard
        if: always()
        run: |
          cd docker
          docker compose down -v
