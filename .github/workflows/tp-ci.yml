name: TP CI - Build, Tests, Start ThingsBoard

on:
  push:
    branches: [ "ci/github-actions" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run unit tests (rule-engine-api)
        run: mvn -pl :rule-engine-api -am test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            **/target/surefire-reports/*.xml
            **/target/surefire-reports/*.txt

  start-thingsboard:
    runs-on: ubuntu-latest
    needs: build-and-unit-tests

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Start ThingsBoard (Docker)
        run: |
          cd docker
          docker compose up -d

      - name: Wait for ThingsBoard to start
        run: |
          for i in {1..60}; do
            if curl -s http://localhost:8080 >/dev/null; then
              echo "ThingsBoard is running"
              exit 0
            fi
            echo "Waiting for ThingsBoard..."
            sleep 5
          done
          echo "ThingsBoard did not start"
          exit 1

      - name: Stop ThingsBoard
        if: always()
        run: |
          cd docker
          docker compose down -v
