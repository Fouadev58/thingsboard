name: TP CI - Build, Tests, Start ThingsBoard

on:
  push:
    branches:
      - ci/github-actions
  pull_request:
    branches:
      - master

jobs:
  build-and-unit-tests:
    name: Build and Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and run unit tests (rule-engine-api)
        run: |
          mvn -pl :rule-engine-api -am test

      - name: Build and run application LayeredArchitectureTest
        run: |
          mvn -pl application -am test -DskipTests
          mvn -pl application -Dtest=LayeredArchitectureTest test

      - name: Upload Surefire test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            **/target/surefire-reports/*.xml
            **/target/surefire-reports/*.txt

  start-thingsboard:
    name: Start ThingsBoard (Docker)
    runs-on: ubuntu-latest
    needs: build-and-unit-tests

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Start ThingsBoard using Docker Compose (Postgres + Kafka)
        run: |
          cd docker
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.postgres.yml \
            -f docker-compose.kafka.yml \
            up -d
          echo "=== docker compose ps ==="
          docker compose ps


      - name: Wait for ThingsBoard to start (up to 15 minutes)
        run: |
          # ThingsBoard est lent au premier démarrage, surtout en CI
          for i in {1..180}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost || true)
            if echo "$code" | grep -qE "200|302|401|404"; then
              echo "ThingsBoard is responding (HTTP $code)"
              exit 0
            fi
            echo "Waiting for ThingsBoard... ($i/180) HTTP=$code"
            sleep 5
          done
          echo "ThingsBoard did not start in time"
          exit 1

      - name: Debug containers status (always)
        if: always()
        run: |
          cd docker
          echo "=== docker compose ps ==="
          docker compose ps
          echo "=== docker ps ==="
          docker ps

      - name: Show ThingsBoard logs (on failure)
        if: failure()
        run: |
          cd docker
          echo "=== docker compose logs (last 300 lines) ==="
          docker compose logs --no-color | tail -n 300

      - name: Stop ThingsBoard
        if: always()
        run: |
          cd docker
          docker compose down -v
